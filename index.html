<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gabriel Henrique Santos Oliveira | Portfólio Compacto</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        /* ====== CONFIGURAÇÕES GERAIS ====== */
        :root {
            --dark: #2d2d2d;
            --orange: #ff9800;
            --cream: #f5f1e8;
            --text-dark: #1a1a1a;
            --text-gray: #444; /* Mais escuro para leitura em letras menores */
            --border: #e0dcd4;
        }

        html, body {
            width: 100%;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #fff;
            color: var(--text-dark);
            line-height: 1.4; /* Reduzido de 1.6 */
            font-size: 14px; /* Tamanho base menor */
        }

        .container {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            padding: 0 15px;
        }

        /* ====== HEADER OTIMIZADO ====== */
        header {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 20px 0;
            border-bottom: 3px solid var(--orange);
            margin-bottom: 15px;
            page-break-inside: avoid;
        }

        .header-photo {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 4px solid var(--orange);
            object-fit: cover;
            flex-shrink: 0;
        }

        .header-info h1 {
            font-size: 1.8rem;
            margin: 0 0 5px 0;
            line-height: 1.1;
        }

        .header-role {
            font-size: 1.1rem;
            color: var(--orange);
            font-weight: 700;
            margin-bottom: 10px;
        }

        .header-contacts {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            font-size: 0.9rem;
        }

        .header-contacts span {
            display: flex;
            align-items: center;
            gap: 5px;
            color: var(--text-gray);
        }
        
        .header-contacts i { color: var(--orange); }

        /* ====== SEÇÕES COMPACTAS ====== */
        section {
            margin-bottom: 15px; /* Reduzido de 30px */
            padding-bottom: 15px;
            border-bottom: 1px solid #eee;
            page-break-inside: avoid;
        }

        section:last-child { border: none; }

        h2 {
            font-size: 1.3rem;
            color: var(--text-dark);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-left: 4px solid var(--orange);
            padding-left: 10px;
            background: #faf8f3;
            padding: 5px 10px;
        }

        h2 i { color: var(--orange); font-size: 1rem; }

        /* ====== EXPERIÊNCIA ====== */
        .experience-item {
            margin-bottom: 12px;
        }

        .job-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 4px;
        }

        .job-title {
            font-weight: 700;
            font-size: 1.05rem;
        }

        .job-meta {
            font-size: 0.85rem;
            color: var(--orange);
            font-weight: 600;
        }

        ul {
            margin: 5px 0;
            padding-left: 18px;
        }

        li { margin-bottom: 3px; font-size: 0.9rem; }

        .tags-compact {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-top: 5px;
        }

        .tag {
            font-size: 0.75rem;
            background: #eee;
            padding: 2px 8px;
            border-radius: 4px;
            color: #555;
        }

        /* ====== GRID DE SKILLS (Mais denso) ====== */
        .skills-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr); /* 3 colunas fixas */
            gap: 10px;
        }

        .skill-item {
            background: #faf8f3;
            padding: 8px;
            border-left: 2px solid var(--orange);
            font-size: 0.85rem;
        }

        .skill-item strong { display: block; color: var(--dark); margin-bottom: 2px; }

        /* ====== DUAS COLUNAS (Formação e Idiomas) ====== */
        .cols-2 {
            display: grid;
            grid-template-columns: 1.5fr 1fr;
            gap: 20px;
        }

        .education-item { margin-bottom: 8px; }
        .education-item h3 { font-size: 0.95rem; margin: 0; }
        .education-item p { margin: 0; font-size: 0.85rem; color: var(--text-gray); }

        /* ====== FOOTER ====== */
        footer {
            text-align: center;
            font-size: 0.8rem;
            color: #888;
            margin-top: 20px;
            padding-top: 10px;
            border-top: 2px solid var(--orange);
        }

        /* ====== BOTÃO FLUTUANTE ====== */
        .floating-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            background: var(--orange);
            color: white;
            border: none;
            border-radius: 50%;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            display: flex; align-items: center; justify-content: center;
            z-index: 999;
        }

        /* CSS ESPECÍFICO PARA PDF */
        .pdf-mode {
            padding: 0 !important;
            margin: 0 !important;
            width: 100% !important;
            max-width: none !important;
        }
        
        .pdf-mode header, .pdf-mode section {
            /* Garante margens seguras na impressão */
            padding-left: 5px;
            padding-right: 5px;
        }
    </style>
</head>
<body>

    <button class="floating-btn" onclick="exportarPDF()">
        <i class="fas fa-file-pdf"></i>
    </button>

    <div id="pdf-content" class="container">
        
        <header>
            <img src="foto.jpg" alt="Foto" class="header-photo">
            <div class="header-info">
                <h1>Gabriel Henrique S. Oliveira</h1>
                <div class="header-role">Engenheiro de Controle e Automação | Especialista em IA & IoT</div>
                <div class="header-contacts">
                    <span><i class="fas fa-envelope">
